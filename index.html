<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CoWriter — write a script with your agent</title>
<meta name="description" content="CoWriter: a screenplay you and an AI agent write together, live, using WebMCP." />
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">✎</span>
      <span class="brand-name">CoWriter</span>
    </div>
    <div class="topbar-status" id="tool-status">Checking for agent tools…</div>
  </header>

  <div class="layout">

    <aside class="sidebar">

      <section class="panel">
        <div class="panel-header">
          <h2>Script</h2>
          <button class="mini-btn" id="add-act-btn" title="Add a new act">+ Act</button>
        </div>
        <div id="act-list" class="act-list"></div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Characters</h2>
          <button class="mini-btn" id="add-character-btn" title="Add a character">+</button>
        </div>
        <div id="character-list" class="character-list"></div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Idea Board</h2>
          <button class="mini-btn" id="add-idea-btn" title="Add an idea">+</button>
        </div>
        <div id="idea-list" class="idea-list"></div>
      </section>

      <section class="panel consistency-panel">
        <div class="panel-header">
          <h2>Consistency</h2>
          <button class="mini-btn" id="run-consistency-btn" title="Ask the agent to check consistency">Check</button>
        </div>
        <p class="hint">Ask your agent in chat: <em>"check the script for consistency"</em> — or click Check for a quick note on how to ask.</p>
        <div id="consistency-report" class="consistency-report"></div>
      </section>

    </aside>

    <main class="script-pane">
      <div id="script-page" class="script-page"></div>
    </main>

  </div>

  <footer class="footer">
    Built for the OpenAI WebMCP Challenge · <span id="tool-count">0</span> agent tools registered
  </footer>

  <!-- Simple modal for add/edit forms -->
  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div class="modal" id="modal">
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
